<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Abroad Guide: Bangladesh Applicants</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--bg:#f5f6f2;--card:#fff;--ink:#16303a;--mute:#5a6c73;--line:#dbe1dc;--acc:#1d5c73;--accbg:#e3eff3;--hi:#f2c230;--hibg:#fff6d6;--warn:#8a3b12;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10191d;--card:#18252b;--ink:#e6eef0;--mute:#9fb2b9;--line:#2b3b42;--acc:#7cc3dc;--accbg:#1e3640;--hi:#f2c230;--hibg:#3a3115;--warn:#f0a77a}}
:root[data-theme="dark"]{--bg:#10191d;--card:#18252b;--ink:#e6eef0;--mute:#9fb2b9;--line:#2b3b42;--acc:#7cc3dc;--accbg:#1e3640;--hi:#f2c230;--hibg:#3a3115;--warn:#f0a77a}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.2;margin:0}
a{color:var(--acc)}
header{padding:22px 18px 10px;max-width:860px;margin:auto}
h1{font-size:1.7rem}
header p{margin:6px 0 0;color:var(--mute)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
nav div{display:flex;gap:8px;overflow-x:auto;padding:10px 18px;max-width:860px;margin:auto;scrollbar-width:none}
nav button{flex:none;font:600 15px "Source Sans 3",sans-serif;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
main{max-width:860px;margin:auto;padding:14px 18px 40px}
section{display:none}section.on{display:block}
h2{font-size:1.35rem;margin:10px 0 12px}
h3{font-size:1.05rem;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.note{background:var(--hibg);border-left:5px solid var(--hi);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:.95rem}
.warn{border-left-color:var(--warn)}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;font-size:.95rem}
.links b{color:var(--mute);font-weight:600}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.tl li:last-child{border:0}
.tl time{flex:none;width:108px;font-weight:600;color:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:10px}
.seg button{font:600 15px "Source Sans 3",sans-serif;padding:8px 20px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--bg)}
dl{margin:0}dt{font-weight:600;margin-top:10px}dd{margin:2px 0 0;color:var(--mute)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px}
summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.4rem;color:var(--acc);flex:none}
details[open]>summary::after{content:"−"}
details>div{padding:0 16px 14px}
summary small{display:block;font-weight:400;color:var(--mute)}
input[type=search],input[type=number]{width:100%;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.steps{list-style:none;margin:0;padding:0}
.steps li{margin:0 0 8px}
.steps label{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.steps input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--acc)}
.steps input:checked+span{color:var(--mute);text-decoration:line-through}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.big{font:700 1.8rem "Bricolage Grotesque",sans-serif;color:var(--acc)}
ul.b{padding-left:20px;margin:6px 0}
ul.b li{margin:4px 0}
footer{max-width:860px;margin:auto;padding:0 18px 30px}
.btn{display:inline-block;padding:10px 14px;border-radius:12px;background:var(--acc);color:var(--bg);text-decoration:none;font-weight:600;margin:4px 8px 4px 0}
.btn.alt{background:var(--accbg);color:var(--acc)}
.tag{display:inline-block;font-size:.78rem;padding:1px 9px;border-radius:99px;background:var(--accbg);color:var(--acc);font-weight:600;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left}
.stat b{display:block;font:700 1.45rem/1.1 "Bricolage Grotesque",sans-serif;color:var(--acc)}
.stat span{display:block;margin-top:3px;font-size:.88rem;line-height:1.3;color:var(--mute)}
.tools{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:0 0 10px}
.tools input{margin:0}
select{font:600 15px "Source Sans 3",sans-serif;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips button{flex:none;font:600 14px "Source Sans 3",sans-serif;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:background .15s,color .15s}
.chips button em{font-style:normal;color:var(--mute);margin-left:5px;font-weight:400}
.chips button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.chips button[aria-pressed=true] em{color:inherit;opacity:.8}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 12px;min-height:38px}
.bar2 #cnt{color:var(--mute);font-size:.95rem}
.ghost{font:600 14px "Source Sans 3",sans-serif;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
#ul details{transition:border-color .15s,box-shadow .15s}
#ul details[open]{border-color:var(--acc)}
#ul summary{display:grid;grid-template-columns:44px 1fr 22px;gap:14px;align-items:center;padding:12px 16px;text-align:left}
#ul summary::after{content:none}
#ul summary .pm{width:22px;text-align:center;font-size:1.4rem;line-height:1;color:var(--acc)}
#ul summary .pm::before{content:"+"}
#ul details[open] summary .pm::before{content:"\2212"}
.mk{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accbg);color:var(--acc);font:700 1rem "Bricolage Grotesque",sans-serif;letter-spacing:.02em}
.mk.top{background:var(--acc);color:var(--bg)}
.ti{min-width:0}
.ti b{display:block;font-weight:600;line-height:1.3}
.ti small{display:block;margin-top:2px;line-height:1.35}
.ti .tag{margin:0 0 4px}
.bd{padding:2px 16px 16px;border-top:1px solid var(--line)}
.bd dl{display:grid;grid-template-columns:150px 1fr;column-gap:0;row-gap:0;margin:0}
.bd dt{margin:0;padding:10px 18px 10px 0;border-bottom:1px solid var(--line);color:var(--ink);font-weight:600;text-align:left}
.bd dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;overflow-wrap:anywhere}
.bd dl>:nth-last-child(-n+2){border-bottom:0}
.bd .acts{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:14px 0 0}
.bd .acts .btn{margin:0}
.bd .acts a.site{overflow-wrap:anywhere;font-size:.95rem}
.bd .src{margin:12px 0 0;color:var(--mute);font-size:.88rem}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mute)}
.tl li{align-items:baseline}
.tl time{text-align:left}
dd{text-align:left}
@media(max-width:560px){.bd dl{grid-template-columns:1fr}.bd dt{padding:10px 0 0;border-bottom:0}.bd dd{padding:2px 0 10px}.bd dl>:nth-last-child(-n+2){border-bottom:1px solid var(--line)}.bd dl>:last-child{border-bottom:0}.stats{gap:8px}.stat{padding:9px 11px}.tools{grid-template-columns:1fr}#ul summary{grid-template-columns:40px 1fr 20px;gap:12px}.mk{width:40px;height:40px}}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.cs{flex:none;min-width:150px}
.cs select{width:100%}
@media(max-width:560px){.hrow{flex-direction:column;gap:10px}.cs{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- extension: ranking providers + add country ---- */
.cs{display:flex;gap:8px;align-items:center}.cs select{flex:1;width:auto}.cs .ghost{flex:none;white-space:nowrap}
.seg.prov{margin:0 0 6px}.pnote{margin:0 0 14px;color:var(--mute);font-size:.9rem}
dialog{width:min(560px,calc(100% - 28px));max-height:calc(100% - 40px);padding:0;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,25,.55)}
.dl{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.dl h2{margin:0}.dl p{margin:0;color:var(--mute);font-size:.93rem}
#clist{max-height:210px;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
#clist button{display:block;width:100%;text-align:left;font:inherit;padding:9px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
#clist button:hover,#clist button[aria-pressed=true]{background:var(--accbg)}#clist .note{margin:8px}
#clog{list-style:none;margin:0;padding:0;font-size:.95rem}#clog li{padding:3px 0}#clog .ok{color:var(--acc)}#clog .er{color:var(--warn)}
.dl .acts{display:flex;gap:8px;flex-wrap:wrap}.dl .added{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.btn.sm{border:0;cursor:pointer;font:600 15px "Source Sans 3",sans-serif}.btn[disabled]{opacity:.5;cursor:not-allowed}
.fnote{margin:6px 0 0;color:var(--mute);font-size:clamp(.7rem,3.1vw,.9rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dev{font-weight:600}
</style>

ational@gih.se", "phone": "+46 8 120 537 00", "top10": false}, {"id": "university-college-stockholm", "name": "University College Stockholm", "city": "Stockholm (Bromma)", "focus": "Private university college", "website": "https://ehs.se/en/", "admissions_email": "info@ehs.se", "phone": "+46 8 564 357 00", "top10": false}, {"id": "university-west", "name": "University West", "city": "Trollhättan", "focus": "Technology, health, business", "website": "http://www.hv.se/en", "admissions_email": "admission@hv.se", "phone": "+46 520 22 30 00", "top10": false}, {"id": "university-of-bor-s", "name": "University of Borås", "city": "Borås", "focus": "Textiles, library and information, engineering, health", "website": "http://www.hb.se/en/", "admissions_email": "admissions@hb.se", "phone": "+46 33 435 40 00", "top10": false}, {"id": "university-of-g-vle", "name": "University of Gävle", "city": "Gävle", "focus": "Multidisciplinary university", "website": "https://www.hig.se/engelska/university-of-gavle", "admissions_email": "registrator@hig.se", "phone": "+46 26 64 85 00", "top10": false}, {"id": "university-of-sk-vde", "name": "University of Skövde", "city": "Skövde", "focus": "IT, engineering, health, business", "website": "http://www.his.se/english", "admissions_email": "admission@his.se", "phone": "+46 500 44 80 00", "top10": false}, {"id": "rebro-university", "name": "Örebro University", "city": "Örebro", "focus": "Multidisciplinary university", "website": "http://www.oru.se/English/", "admissions_email": "freemover@oru.se", "phone": "+46 19 30 30 00", "top10": false}]}, "content": {"sections": {"overview": {"title": "Overview", "html": "<div class=\"card\"><h3 style=\"margin-top:0\"><span data-f=\"intake\">Autumn 2027</span>: first international round</h3>\n<ul class=\"tl\" id=\"tl\"></ul>\n<p class=\"links\"><a data-u=\"dates\">Autumn semester dates</a></p>\n<div class=\"note\">Dates come from the official page. Always recheck the live dates.</div></div>\n\n<h3>General entry requirements</h3>\n<div class=\"seg\" id=\"lvl\"><button aria-pressed=\"true\" data-l=\"ug\">Bachelor’s (UG)</button><button aria-pressed=\"false\" data-l=\"pg\">Master’s (PG)</button></div>\n<div class=\"card\"><dl id=\"req\"></dl></div>\n<div class=\"note\"><b>English score guide:</b> IELTS Academic 6.5 overall, often with no band below 5.5, is a common route to English 6. This is not universal; verify the exact accepted test and component scores for each programme.</div>\n<div class=\"note warn\"><b>Bangladesh PG note:</b> A three-year general Bachelor’s without Honours does not normally meet the general Master’s requirement. Certain three-year Honours qualifications in selected Social Science/Humanities subjects may be assessed under the official country instructions.</div>\n<p class=\"links\"><b>Official country instructions:</b> <a data-u=\"ug\">UG Bangladesh</a> <a data-u=\"pg\">PG Bangladesh</a> <a data-u=\"eng1\">English requirements</a></p>"}, "apply": {"title": "Application steps", "html": "<p>Apply through UniversityAdmissions.se. Tick each step as you finish it; your progress is saved on this device.</p>\n<div class=\"bar\"><i id=\"pb\"></i></div>\n<ol class=\"steps\" id=\"st\"></ol>\n<div class=\"card\"><b>Choices allowed:</b> the first international round generally permits up to <b>8 Bachelor’s</b> or <b>4 Master’s</b> selections. Master’s ranking is especially important.</div>\n<div class=\"card\"><b>Application fee:</b> SEK <span data-f=\"fees.application_sek\">900</span>, one fee per semester, not per university or programme.</div>\n<p class=\"links\"><a data-u=\"dates\">Autumn semester dates</a> <a data-u=\"abach\">Apply to Bachelor’s</a> <a data-u=\"amast\">Apply to Master’s</a></p>"}, "eng": {"title": "English and study gap", "html": "<details open><summary>English requirement</summary><div>\n<p>The general requirement for most Bachelor’s and Master’s programmes is Swedish <b>English 6 / English Level 2</b>. Some programmes require a different level, so the programme page always takes priority.</p>\n<ul class=\"b\">\n<li><b>IELTS Academic:</b> overall 6.5 with no section below 5.5. IELTS General Training and IELTS Indicator are not accepted. University Admissions verifies the score electronically.</li>\n<li><b>TOEFL iBT:</b> the scale changed from 21 January 2026. For tests on/after that date, English 6 needs total 4.5 on the new 1–6 scale, no section below 4.0. For tests on/before 20 January 2026, the old requirement is total 90 with written score 20. Check the official page for test version and reporting rules.</li>\n<li><b>MOI / Medium of Instruction:</b> Bangladesh HSC English does not meet the Swedish English requirement. A simple MOI letter from a Bangladeshi institution is not an automatic waiver. Certain prior university studies may satisfy English 6 under specific country and study conditions; get confirmation from University Admissions or the university before advising a waiver.</li></ul></div></details>\n<details><summary>Study gap</summary><div>\n<p>There is no single Sweden-wide rule that automatically rejects an applicant for a particular number of gap years. The university assesses academic eligibility and programme fit.</p>\n<p>Be ready to explain the gap truthfully, with evidence where relevant: employment letters, business records, training certificates, internships, family responsibilities or other verifiable activities.</p>\n<div class=\"note\">A gap explanation does not replace academic or English requirements.</div></div></details>\n<p class=\"links\"><a data-u=\"eng2\">English language requirements</a> <a data-u=\"ug\">Bangladesh UG instructions</a> <a data-u=\"pg2\">Bangladesh Master’s instructions</a></p>"}, "money": {"title": "Money matters", "html": "<details open><summary>Tuition payment and transfer</summary><div>\n<p>A non-EU/EEA fee-paying student must pay the <b>first tuition instalment</b> before applying for a higher-education residence permit. The whole multi-year amount is not normally due upfront. The university confirms payment to the Swedish Migration Agency; the instalment amount and due date come from the university invoice.</p>\n<h3>Sending tuition from Bangladesh</h3>\n<ul class=\"b\">\n<li>Wait for the official tuition invoice and payment instructions after admission.</li>\n<li>Ask the university which channels it supports: international bank transfer/SWIFT, its nominated payment provider (if any), or card. Methods and account details differ by university.</li>\n<li>Visit a Bangladeshi authorised dealer (AD) bank and ask about outward remittance for overseas education under current Bangladesh Bank foreign-exchange rules. The bank may open or use a student file and ask for the admission letter, tuition invoice, passport, educational documents and other compliance papers.</li>\n<li>Transfer only to the beneficiary account or payment provider named in the university’s official invoice. Include the student’s name, application/student ID and invoice reference exactly as instructed.</li>\n<li>Pay bank/intermediary charges as instructed so the university receives the correct net amount. Keep the SWIFT/remittance receipt and get the university’s payment confirmation.</li></ul>\n<div class=\"note warn\">“Student file” is a Bangladeshi bank/remittance process, not a Swedish university payment method. There is no single Swedish recipient account. Never use an agent’s personal account or an unofficial beneficiary. Ask the university’s finance office to confirm any changed bank details independently.</div>\n<p><b>Separate fee:</b> UniversityAdmissions.se charges SEK <span data-f=\"fees.application_sek\">900</span> per semester for the application. It is separate from tuition and can be paid online by Visa/Mastercard or by bank transfer using the applicant-specific reference number in the account.</p>\n<p class=\"links\"><a data-u=\"fee\">Pay application fee</a> <a data-u=\"tuition\">Paying tuition fees</a></p></div></details>\n\n<details><summary>Bank statement and proof of funds</summary><div>\n<div class=\"card\" style=\"background:var(--accbg)\"><b>Maintenance calculator</b> (<span data-f=\"maintenance.year\">2026</span> rate: SEK <span data-f=\"maintenance.monthly\">10,656</span> per month)\n<div class=\"row\"><input type=\"number\" id=\"mo\" min=\"1\" max=\"48\" value=\"12\" aria-label=\"Months of study permit\" style=\"width:90px\"><span>months</span></div>\n<div class=\"big\" id=\"tot\">SEK 127,872</div><div class=\"big\" id=\"bdt\" style=\"font-size:1.35rem;color:var(--ink)\"></div><p id=\"fxn\" style=\"color:var(--mute);font-size:.88rem;margin:6px 0 0\"></p></div>\n<p>The amount is updated over time; an application submitted in 2027 must use the amount then in force. Funds must cover the entire permit period requested, subject to the Migration Agency’s rules.</p>\n<ul class=\"b\">\n<li><b>Personal bank statement:</b> issued no more than four months before the requested permit start date, showing account holder(s), bank name, date of issue, balance and currency. The money must be accessible for living costs. Include any central-bank permission required to take funds out of Bangladesh.</li>\n<li><b>Account access:</b> funds must be in an account belonging to the applicant, from which only the applicant (and accompanying partner, where applicable) can withdraw. If relatives provide money, it must be transferred into an account in the student’s name and accessible to the student. A private relative is not accepted as a formal “sponsor” under the Migration Agency’s sponsor category.</li>\n<li><b>Holding period:</b> the published rule specifies the statement’s issue date and accessibility of funds; it sets no universal 3-month or 6-month seasoning period. Banks may still ask for source-of-funds evidence, and sudden unexplained deposits can invite questions. Keep evidence of the genuine source of funds.</li>\n<li><b>Alternatives:</b> a qualifying scholarship, approved student grant/loan or eligible sponsor can count if the official documentation states provider, recipient, amount, payment dates, period and amount available for living costs. Locked deposits unavailable during the permit period, shares/funds and credit facilities are not accepted as personal bank assets.</li></ul></div></details>\n\n<details><summary>Solvency certificate and legal attestation</summary><div>\n<p>A lawyer-attested solvency certificate, or a bank letter merely stating that a family has financial capacity, <b>does not replace</b> proof of money actually available to the student. Migrationsverket asks for evidence matching its maintenance rules.</p>\n<ul class=\"b\"><li>Provide the student’s qualifying bank statement with the required details and accessible balance.</li>\n<li>If a parent or relative provides the money, transfer it to the student’s own accessible account and keep the transfer/source evidence.</li>\n<li>A lawyer’s attestation cannot convert an inaccessible balance or a third-party account into the student’s personal bank assets.</li></ul></div></details>"}, "visa": {"title": "Residence permit", "html": "<div class=\"card\">Bangladeshi citizens normally need a residence permit for higher-education studies lasting more than three months. Apply after final admission and payment of the first tuition instalment.</div>\n<details open><summary>How to apply</summary><div><ul class=\"b\">\n<li>Prepare a valid passport and clear copies of the pages requested by Migrationsverket.</li>\n<li>Prepare the final admission decision showing full-time, on-campus study; proof of paid tuition (the university normally reports this); maintenance-fund evidence; and comprehensive health insurance if the total study period is under one year and the student is not covered through Swedish registration/institutional arrangements.</li>\n<li>Open the Swedish Migration Agency’s online e-service for higher-education studies. Enter personal, passport, university/programme details and intended permit period.</li>\n<li>Choose the embassy/consulate location requested in the application, in case the Agency needs an interview or passport presentation. Not every Swedish mission handles migration cases.</li>\n<li>Upload legible supporting documents, pay the fee and submit.</li>\n<li>Wait for Migrationsverket to contact you. Attend passport verification, interview, photograph and fingerprint/biometric steps only when instructed or according to the relevant mission’s published procedure.</li>\n<li>Wait for the decision. Do not travel to Sweden until the permit has been granted and the required permit card/entry arrangements are in place.</li></ul>\n<p class=\"links\"><a data-u=\"mig\">Swedish Migration Agency — Higher education</a></p></div></details>\n<details><summary>Fee, embassy and biometrics</summary><div>\n<p>First-time higher-education permit fee: <b>SEK <span data-f=\"fees.permit_adult_sek\">1,500</span></b> for an adult (children under 18: SEK <span data-f=\"fees.permit_child_sek\">750</span>). For an online application, pay in the Migrationsverket e-service by Visa or Mastercard. It is separate from the SEK <span data-f=\"fees.application_sek\">900</span> University Admissions fee and is normally non-refundable if refused.</p>\n<p><b>Embassy of Sweden, Dhaka</b> has a Migration Section. Select the relevant mission in the online application and follow the exact instruction you receive. Do not assume every applicant needs an interview, or book a trip to New Delhi independently. New Delhi is not the default for someone resident in Bangladesh; attend another mission only if the Migration Agency specifically directs you.</p>\n<p>If passport verification, interview or biometrics are required, follow the appointment instructions from the Migration Agency/Embassy and bring the passport and requested originals. The Embassy states that visits are by pre-booked appointment.</p>\n<p>Email: <a href=\"mailto:migration.dhaka@gov.se\">migration.dhaka@gov.se</a><br>Phone: <a href=\"tel:+880255668525\">+880 255 668 525</a> (Sunday, Tuesday and Thursday, 15:00–16:00)</p>\n<p class=\"links\"><a data-u=\"mig\">Migrationsverket — fees and application</a> <a data-u=\"emb\">Embassy of Sweden, Dhaka — contact</a></p></div></details>\n<details><summary>Decision and processing time</summary><div>\n<p>The Migration Agency reviews the application, documents, tuition confirmation and financial evidence. It may request more documents, a passport presentation or an interview. If you applied online, Migrationsverket emails you when a decision is made; the decision is sent to your selected embassy or representative, and you may need an appointment to collect the permit card. The Embassy does not decide the case; Migrationsverket does.</p>\n<div class=\"card\" style=\"background:var(--accbg)\"><span class=\"big\"><span data-f=\"permit_wait.percent\">75</span>%</span> of recently decided first-time higher-education cases were decided within <b><span data-f=\"permit_wait.months\">3</span> months</b>.</div>\n<p>This is a statistical guide, not a guaranteed service standard or a Bangladesh-specific promise. Incomplete applications or extra checks can take longer. Apply immediately after the first tuition payment and submit a complete file.</p>\n<p class=\"links\"><a data-u=\"wait\">Waiting-time statistics</a> <a data-u=\"first\">First-time study application process</a></p></div></details>"}, "after": {"title": "After you graduate", "html": "<details open><summary>Post-study work</summary><div>\n<p>A student who completed a programme of at least two semesters may apply, <b>before the study permit expires</b>, for a permit to look for work or explore starting a business, for up to <b>12 months</b>. You must have completed the programme and passed all courses, have sufficient funds for the period, and meet insurance/passport requirements.</p>\n<p><b>If you find a job:</b> you may apply for a work permit from inside Sweden if the legal conditions are met, including a signed employment contract, appropriate terms and employer insurance. Apply before the current permit expires. Check current salary and work-permit rules at the time of application.</p>\n<p class=\"links\"><a data-u=\"jobs\">Post-study job-search permit</a> <a data-u=\"workp\">Work permit after studies</a></p></div></details>\n<details><summary>Permanent residence (PR)</summary><div>\n<p>A Bachelor’s or Master’s student permit is generally temporary and does not itself count toward the ordinary work-permit residence period for PR. A common route is to move to a qualifying work permit and later meet the requirement of at least <b>four years</b> holding and complying with a work permit during the previous seven years, plus sustainable self-support and good-conduct requirements.</p>\n<div class=\"note warn\">Exact rules depend on the permit category and legislation in force when applying. Do not promise PR as an automatic result of graduation or employment.</div>\n<p class=\"links\"><a data-u=\"pr\">Permanent residence — work permit route</a></p></div></details>\n<details><summary>Working while studying <span class=\"tag\">rule update</span></summary><div>\n<p>For higher-education study permits granted on or after <b>11 June 2026</b>, the Migration Agency currently states a maximum of <b><span data-f=\"work_hours_per_week\">15</span> hours of work per week</b> during studies, subject to exceptions (for example, work integrated with the programme and certain summer periods). Check the current rule for the student’s permit date.</p></div></details>"}, "schol": {"title": "Scholarships", "html": "<details open><summary>Swedish Institute (SI) Scholarship for Global Professionals</summary><div>\n<p>Bangladesh is among the eligible countries in the 2026/27 SI programme information. The award is for eligible full-time Master’s programmes and is highly competitive.</p>\n<ul class=\"b\"><li>Applicants normally need relevant work experience and demonstrated leadership experience.</li>\n<li>Apply to an eligible Master’s programme through UniversityAdmissions.se first.</li>\n<li>The SI application is separate, within SI’s published scholarship window.</li>\n<li>Eligibility, programmes, work-hour evidence, leadership criteria and deadlines can change each cycle; use the current SI call and programme list, not a previous year’s rules.</li></ul>\n<p class=\"links\"><a data-u=\"si\">Swedish Institute scholarships</a> <a data-u=\"siglob\">SI Scholarship for Global Professionals</a></p></div></details>\n<details><summary>University scholarships</summary><div>\n<p>Examples: Lund University Global Scholarship, KTH Scholarship, Uppsala University Global Scholarship, Stockholm University Scholarship Scheme, University of Gothenburg Axel Adler Scholarship, Chalmers IPOET, Linköping University International Scholarship, Umeå University scholarships and Karolinska Institutet Global Master’s Scholarship.</p>\n<p>These are competitive and usually tuition-fee waivers or reductions; living costs are not automatically covered. Some universities require a separate scholarship application, while others consider eligible applicants automatically.</p>\n<p class=\"links\"><a data-u=\"uascho\">University Admissions — scholarships</a></p></div></details>\n<details open><summary>Practical sequence</summary><div><ol class=\"b\">\n<li>Identify an eligible programme.</li><li>Apply by the first international round.</li><li>Rank programmes correctly.</li><li>Submit the university application and required documents.</li><li>Submit the separate scholarship application if required.</li></ol>\n<p>Prepare academic records, CV, motivation statement, work-experience evidence and leadership references according to the scholarship’s own checklist.</p></div></details>"}}, "links": {"ug": "https://www.universityadmissions.se/en/apply-to-bachelors/provide-application-documents-bachelors/country-instructions/bangladesh/", "pg": "https://www.universityadmissions.se/en/apply-to-masters/provide-application-documents-masters/country-instructions/bangladesh/", "pg2": "https://www.universityadmissions.se/en/apply-to-masters/provide-application-documents-masters/country-instructions/bangladesh", "eng1": "https://www.universityadmissions.se/en/entry-requirements/english-language-requirements/", "eng2": "https://www.universityadmissions.se/en/entry-requirements/english-language-requirements", "dates": "https://www.universityadmissions.se/en/key-dates-and-deadlines/autumn-semester-dates", "abach": "https://www.universityadmissions.se/en/apply-to-bachelors/", "amast": "https://www.universityadmissions.se/en/apply-to-masters/", "fee": "https://www.universityadmissions.se/en/fees-scholarships-residence-permit/pay-your-application-fee/", "tuition": "https://www.universityadmissions.se/en/fees-scholarships-residence-permit/paying-your-tuition-fees/", "mig": "https://www.migrationsverket.se/en/you-want-to-apply/study/higher-education", "emb": "https://www.swedenabroad.se/en/embassies/bangladesh-dhaka/contact/", "wait": "https://www.migrationsverket.se/en/contact-us/waiting-times.html", "first": "https://www.migrationsverket.se/en/you-are-waiting-for-a-decision/study/you-have-applied-for-the-first-time---studies.html", "jobs": "https://www.migrationsverket.se/en/you-want-to-extend/study/look-for-work-after-completing-your-studies-in-sweden.html", "workp": "https://www.migrationsverket.se/en/you-want-to-apply/work/employee-or-self-employed/students-who-have-found-work.html", "pr": "https://www.migrationsverket.se/en/you-want-to-extend/work/employee-or-self-employed/employees.html", "si": "https://si.se/en/apply/scholarships/", "siglob": "https://si.se/en/apply/scholarships/swedish-institute-scholarships-for-global-professionals/", "uascho": "https://www.universityadmissions.se/en/fees-scholarships-residence-permit/scholarships/"}, "req": {"ug": [["Academic qualification", "HSC or an accepted equivalent qualification. Programme-specific subject requirements and grades may apply."], ["Mathematics", "For Bangladesh HSC qualifications after 2009, passing Mathematics is required for general eligibility. Check the official country instructions for SSC Mathematics provisions."], ["English", "HSC English alone does not automatically meet Sweden’s English requirement. Accepted test results or other approved evidence are needed."], ["Documents", "Board-issued SSC and HSC certificates and marksheets, following the Bangladesh country instructions."]], "pg": [["Academic qualification", "Normally a 4-year Bachelor’s degree, or Bachelor’s + Master’s totalling 4 years. Limited subject-specific exceptions may apply under Bangladesh country instructions."], ["Mathematics", "Depends on the programme and the student’s previous academic background."], ["English", "English 6 / English Level 2 equivalent. Accepted tests and score requirements must be checked."], ["Documents", "University-issued degree certificate and transcript. Follow the Bangladesh country instructions for certification and submission."]]}, "steps": ["Choose the level and intake: Bachelor’s (UG) or Master’s (PG). Search English-taught programmes at UniversityAdmissions.se and each university’s programme page.", "Check eligibility before applying: Bangladesh country-specific academic rules, subject prerequisites, degree level, English 6 equivalence and any programme-specific requirements.", "Create the applicant’s own account using their personal email and correct identity details. The student should control the account and password.", "Select and rank programmes carefully (up to 8 Bachelor’s or 4 Master’s in the first international round).", "Submit the application and upload certificates, transcripts, passport/identity documents and English test evidence by the supporting-document deadline.", "Pay the SEK <span data-f='fees.application_sek'>900</span> application fee by the deadline if required.", "Monitor the account and email for document requests and results. If admitted as a fee-paying student, follow the university’s tuition invoice and pay the first instalment.", "After the university registers the tuition payment, apply online for the residence permit through Migrationsverket. Arrange housing, insurance where required and travel only after the permit is granted."], "tabs": [["overview", "Overview"], ["unis", "Universities"], ["apply", "Apply"], ["eng", "English & gap"], ["money", "Money"], ["visa", "Visa"], ["after", "After study"], ["schol", "Scholarships"]], "meta": {"code": "se", "name": "Sweden", "flag": "🇸🇪", "currency": "SEK", "title": "Study in Sweden: Applicant Guide", "sub": "Bangladesh applicants · Universities, rankings, application, visa and money.", "portal": "UniversityAdmissions.se", "portal_url": "https://www.universityadmissions.se/en/find-out-more/swedish-universities/", "top_label": "Top 10", "rank_note": "Only the Top 10 have full counselling profiles; the other institutions are listed separately.", "gen_note": "Entry requirements, tuition fees and scholarships differ by programme. Use the button below to see this university’s programmes, then open a programme to read its fee and requirements.", "uni_title": "Swedish universities", "prog_btn": "Programmes and fees", "list_note": "The official University Admissions list names institutions.", "caution": "<b>Counsellor caution:</b> Always verify the current intake, exact programme, fee invoice, scholarship call, maintenance amount, permit fee and embassy instructions immediately before advising a student. Bank rules in Bangladesh and Swedish immigration rules can change. No agent, counsellor or university can guarantee admission, scholarship or a residence-permit decision."}}}, "no": {"facts": {"last_checked": "2026-11-04", "intake": "Autumn 2027", "dates": {"source": "https://www4.uib.no/en/studies/admission-and-application/application-process-from-outside-eueea-and-switzerland", "rows": [{"date": "1 Nov 2026", "event": "Søknadsweb opens for applicant Business and management", "website": "https://www.bi.edu/", "top10": false}, {"id": "vid", "name": "VID Specialized University", "city": "Oslo", "focus": "Health, social studies and theology", "website": "https://www.vid.no/en/", "top10": false}, {"id": "mf", "name": "MF Norwegian School of Theology, Religion and Society", "city": "Oslo", "focus": "Theology and religion", "website": "https://www.mf.no/en", "top10": false}]}, "content": {"meta": {"code": "no", "name": "Norway", "flag": "🇳🇴", "currency": "NOK", "title": "Study in Norway: Applicant Guide", "sub": "Bangladesh applicants · Universities, rankings, application, visa and money.", "portal": "NOKUT accredited institutions", "portal_url": "https://www.nokut.no/en/higher-education/higher-education-institutions/", "top_label": "QS ranked", "uni_title": "Norwegian universities", "prog_btn": "Programmes on Study in Norway", "list_note": "The list covers the QS-ranked universities and the main public and private institutions; the NOKUT list is the full register of accredited institutions.", "rank_note": "Only 8 Norwegian institutions appear in the QS World University Rankings 2027, so the ranked list has 8 entries. The other institutions are listed separately.", "gen_note": "Entry requirements, tuition fees and scholarships differ by programme. Open the Study in Norway button to see English-taught programmes, then read the programme page for its fee and requirements.", "caution": "<b>Counsellor caution:</b> Always verify the current intake, exact programme, tuition fee, scholarship, funds amount, permit fee and embassy instructions immediately before advising a student. Bangladesh bank rules and Norwegian immigration rules can change. No agent, counsellor or university can guarantee admission, a scholarship or a residence-permit decision."}, "tabs": [["overview", "Overview"], ["unis", "Universities"], ["apply", "Apply"], ["eng", "English"], ["money", "Money"], ["visa", "Permit"], ["after", "After study"], ["schol", "Scholarships"]], "links": {"sin": "https://studyinnorway.no/", "entry": "https://studyinnorway.no/entry-requirements-bachelor-and-master-programmes", "gsu": "https://hkdir.no/en/foreign-education/lists-and-databases/higher-education-entrance-qualification-gsu", "uiabd": "https://www.uia.no/english/studies/how-to-apply/countries/bangladesh.html", "sweb": "https://fsweb.no/soknadsweb/login.jsf", "nokut": "https://www.nokut.no/en/higher-education/higher-education-institutions/", "uibproc": "https://www4.uib.no/en/studies/admission-and-application/application-process-from-outside-eueea-and-switzerland", "uibperm": "https://www4.uib.no/en/studies/admission-and-application/first-time-study-permit", "uiotuit": "https://uio.no/english/studies/admission/tuition", "omtuit": "https://student.oslomet.no/en/tuition-fees-for-international-students-from-outside-eu-eea", "nmbufunds": "https://www.nmbu.no/en/studies/instructions-funds-transfer", "udi": "https://www.udi.no/en/want-to-apply/studies/studietillatelse/", "udiapply": "https://www.udi.no/en/want-to-apply/studies/studietillatelse/university-college-or-university/how-to-apply-for-a-residence-permit-for-a-student-at-a-university-college-or-university/", "udifees": "https://www.udi.no/en/word-definitions/fees/", "udiwait": "https://www.udi.no/en/word-definitions/guide-to-case-processing-times-for-study-permits/", "udiwork": "https://www.udi.no/en/want-to-apply/work-immigration/", "udiperm": "https://www.udi.no/en/want-to-apply/permanent-residence/"}, "req": {"ug": [["Academic qualification", "HSC plus 1 year of university education, following the national GSU list as shown on UiA’s Bangladesh page. Check the programme page for subject requirements."], ["Bachelor’s places", "English-taught bachelor’s programmes for applicants from outside the EU/EEA are limited. UiA states that residence permits for Bangladeshi bachelor’s applicants are rarely granted."], ["English", "UiA example: IELTS Academic 5.0 or TOEFL iBT 60 (3.5 on the scale used after 21 January 2026). Other universities set their own scores."], ["Documents", "Officially issued transcripts and diplomas uploaded to Søknadsweb. Documents not in English, Norwegian, Swedish or Danish need an authorised translation."]], "pg": [["Academic qualification", "HSC plus 4 years of university education (180 ECTS equivalent). Your bachelor’s degree must include the courses the programme asks for."], ["Grades", "UiA example: C or better on the Norwegian grading scale, calculated from the degree used for admission. Other universities set their own minimum."], ["English", "UiA example: IELTS Academic 6.0, TOEFL iBT 80 (4.0 on the new scale) or PTE 62. Many programmes ask for more; check the programme page."], ["Documents", "Final bachelor’s diploma and transcripts, officially issued and certified by the registrar’s or examinations office. Provisional certificates are accepted only in limited cases (UiA: degree completed within the last two years)."]]}, "steps": ["Choose the level: Master’s is the main route for applicants from Bangladesh. Search English-taught programmes on Study in Norway and on each university’s programme page.", "Check eligibility: the Bangladesh requirement on the GSU list, the programme’s course requirements, the grade minimum and the English score.", "Prepare documents: officially issued transcripts and diplomas, passport copy, English test result and any translations. Do not email documents; upload them.", "Create the applicant’s own account on Søknadsweb with a personal email. Apply as an international applicant between 1 Nov and 1 Dec, unless the programme page states another window.", "Upload all documents before the deadline. Many universities allow only one master’s programme per application, so confirm the rule for each.", "Read the result in Søknadsweb (results usually arrive by April) and answer the offer by the date stated; late answers withdraw the offer.", "If you pay tuition, follow the university’s invoice. Transfer the living-cost amount to the account the university sets up, as the offer asks.", "Apply for the study permit in UDI’s Application Portal, pay the fee, and attend the embassy or VFS appointment if required. Travel only after the permit is granted."], "sections": {"overview": {"title": "Overview", "html": "<div class=\"card\"><h3 style=\"margin-top:0\"><span data-f=\"intake\">Autumn 2027</span>: international applicants</h3>\n<ul class=\"tl\" id=\"tl\"></ul>\n<p class=\"links\"><a data-u=\"uibproc\">Example: UiB application process</a> <a data-u=\"sin\">Study in Norway</a></p>\n<div class=\"note\">Windows differ by university and programme. NTNU lists 1 Feb to 1 Mar for some programmes, and music performance programmes at UiA close on 15 Dec. Check the programme page.</div></div>\n\n<h3>General entry requirements</h3>\n<div class=\"seg\" id=\"lvl\"><button aria-pressed=\"true\" data-l=\"ug\">Bachelor’s (UG)</button><button aria-pressed=\"false\" data-l=\"pg\">Master’s (PG)</button></div>\n<div class=\"card\"><dl id=\"req\"></dl></div>\n<div class=\"note warn\"><b>English test:</b> A Bangladeshi bachelor’s or master’s degree taught in English does not exempt you from the English requirement (UiA). Exemptions apply to studies in the UK, USA, Canada, Ireland, New Zealand, Australia or the Nordic countries, under each university’s rules.</div>\n<p class=\"links\"><b>Official sources:</b> <a data-u=\"gsu\">GSU list (HK-dir)</a> <a data-u=\"entry\">Entry requirements</a> <a data-u=\"uiabd\">UiA Bangladesh page</a></p>"}, "apply": {"title": "Application steps", "html": "<p>Applications go through Søknadsweb or the university’s own portal. Tick each step as you finish it; your progress is saved on this device.</p>\n<div class=\"bar\"><i id=\"pb\"></i></div>\n<ol class=\"steps\" id=\"st\"></ol>\n<div class=\"card\"><b>Choices allowed:</b> UiB allows one master’s programme per application. Other universities set their own limit.</div>\n<div class=\"card\"><b>Application fee:</b> varies by university. Check the programme page before paying.</div>\n<p class=\"links\"><a data-u=\"sweb\">Søknadsweb</a> <a data-u=\"sin\">Study in Norway</a> <a data-u=\"nokut\">Accredited institutions (NOKUT)</a></p>"}, "eng": {"title": "English and grades", "html": "<details open><summary>English requirement</summary><div>\n<p>Each university sets the accepted tests and scores for its programmes. The programme page always takes priority.</p>\n<ul class=\"b\">\n<li><b>UiA master’s:</b> IELTS Academic 6.0, TOEFL iBT 80 (4.0 on the scale used after 21 January 2026), PTE Academic 62. Scores older than two years are not valid.</li>\n<li><b>UiA bachelor’s:</b> IELTS Academic 5.0, TOEFL iBT 60 (3.5 on the new scale), PTE Academic 51.</li>\n<li><b>Bangladesh degrees:</b> a bachelor’s or master’s taught in English in Bangladesh does not exempt you from the English test (UiA).</li>\n<li><b>Exemption routes (UiA):</b> one year of university study taught in English in the UK, USA, Canada, Ireland, New Zealand or Australia, or a degree taught in English in a Nordic country.</li></ul></div></details>\n<details><summary>Programme requirements and grades</summary><div>\n<p>Your bachelor’s degree must include specific courses for most master’s programmes. Admission is competitive, and applicants are ranked by academic results. Meeting the requirements does not guarantee a place.</p>\n<p>You may be asked for course descriptions. If you are asked and do not send them, your application is not processed (UiA).</p></div></details>\n<p class=\"links\"><a data-u=\"uiabd\">UiA Bangladesh page</a> <a data-u=\"gsu\">GSU list (HK-dir)</a></p>"}, "money": {"title": "Money matters", "html": "<details open><summary>Tuition</summary><div>\n<p>Students from outside the EU/EEA pay tuition at public institutions since autumn 2023. Each university sets the rate per programme. All students also pay a semester fee to the student welfare organisation.</p>\n<ul class=\"b\">\n<li><b>OsloMet 2026/27:</b> most master’s programmes NOK 67,000 to 95,000 per year.</li>\n<li><b>University of Oslo:</b> tuition applies to non-EU/EEA students; UiO states it offers no scholarships that cover tuition fees.</li>\n<li><b>University of Bergen:</b> all admitted applicants from outside the EU/EEA pay tuition fees.</li></ul>\n<p class=\"links\"><a data-u=\"uiotuit\">UiO tuition</a> <a data-u=\"omtuit\">OsloMet tuition</a></p></div></details>\n\n<details open><summary>Proof of funds for the study permit</summary><div>\n<div class=\"card\" style=\"background:var(--accbg)\"><b>Funds calculator</b> (UDI: NOK <span data-f=\"maintenance.annual\">170,368</span> per academic year, NOK <span data-f=\"maintenance.monthly\">15,488</span> per month)\n<div class=\"row\"><input type=\"number\" id=\"mo\" min=\"1\" max=\"6\" value=\"2\" aria-label=\"Academic years\" style=\"width:90px\"><span>academic years</span></div>\n<div class=\"big\" id=\"tot\">NOK 340,736</div><div class=\"big\" id=\"bdt\" style=\"font-size:1.35rem;color:var(--ink)\"></div><p id=\"fxn\" style=\"color:var(--mute);font-size:.88rem;margin:6px 0 0\"></p></div>\n<ul class=\"b\">\n<li><b>One semester only:</b> NOK <span data-f=\"maintenance.autumn_only\">77,440</span> for autumn or NOK <span data-f=\"maintenance.spring_only\">92,928</span> for spring.</li>\n<li><b>Where the money sits:</b> loans, grants, or your own funds in a Norwegian bank account or the university’s deposit account. Expected job income can count if you already have an offer.</li>\n<li><b>Tuition on top:</b> if you pay tuition, you must show it is paid or that you hold the money for it, in a Norwegian account or the university’s deposit account.</li>\n<li><b>Deposit accounts:</b> universities set these up for admitted students. NMBU uses a SiÅS account and returns the money if the permit is refused. UiA withdraws the offer if you do not transfer the amount.</li></ul>\n<p class=\"links\"><a data-u=\"udi\">UDI study permit</a> <a data-u=\"nmbufunds\">NMBU funds transfer</a></p></div></details>\n\n<details><summary>Bank statement at application</summary><div>\n<p>Some universities ask for a bank statement when you apply. Example from UiA:</p>\n<ul class=\"b\">\n<li>Statement in your own name, issued within the last three months, dated, signed and stamped by a bank official.</li>\n<li>If a sponsor provides the money, upload the sponsor’s statement and a confirmation letter.</li>\n<li>The statement must show the full amount for tuition and living costs. Work contracts are not accepted.</li></ul></div></details>"}, "visa": {"title": "Study permit", "html": "<div class=\"card\">Bangladeshi citizens need a study permit for studies longer than three months. Apply after you receive your offer and the university confirms your place.</div>\n<details open><summary>How to apply</summary><div><ul class=\"b\">\n<li>Collect the admission letter, passport, proof of funds, proof that tuition is paid or covered, and proof of housing in Norway.</li>\n<li>Print UDI’s checklist, create an account in UDI’s Application Portal, and submit the online application.</li>\n<li>Pay the application fee in the portal by Visa, Mastercard, Apple Pay or Google Pay.</li>\n<li>Book the appointment at the embassy or VFS Application Centre you chose, and hand in your documents and biometrics.</li>\n<li>The place of study must be on NOKUT’s list of accredited institutions, and you must study full-time.</li>\n<li>Do not travel to Norway until the permit is granted, unless UDI says your case allows it.</li></ul>\n<p class=\"links\"><a data-u=\"udiapply\">UDI: how to apply</a> <a data-u=\"uibperm\">Example: UiB study permit page</a></p></div></details>\n<details><summary>Fee and processing time</summary><div>\n<p>Study permit fee for an adult: <b>NOK <span data-f=\"fees.permit_adult_nok\">5,400</span></b> (under 18: NOK <span data-f=\"fees.permit_child_nok\">2,700</span>). Renewals cost the same. UiB advises applying by 1 July for an autumn start so the case is processed in time.</p>\n<p>UDI publishes processing times for study permits. The figure is a guide, not a promise.</p>\n<p class=\"links\"><a data-u=\"udifees\">UDI fees</a> <a data-u=\"udiwait\">UDI processing times</a></p></div></details>\n<details><summary>Work and family while studying</summary><div>\n<ul class=\"b\">\n<li>A study permit allows up to <b><span data-f=\"work_hours_per_week\">20</span> hours of work per week</b> during studies and full-time work during holidays. You cannot be self-employed or run your own business.</li>\n<li>Your spouse or cohabitant and children can usually apply to join you. UDI currently cannot process a family member’s case at the same time as yours.</li>\n<li>UDI expects it to be likely that you can return home after your studies.</li></ul></div></details>"}, "after": {"title": "After you graduate", "html": "<details open><summary>After graduation</summary><div>\n<p>Graduates who held a study permit can apply for a job-seeker residence permit before the study permit expires. Its maximum length is one year, and you must look for skilled work. Check UDI for the current funds and document requirements.</p>\n<p class=\"links\"><a data-u=\"udiwork\">UDI work immigration</a></p></div></details>\n<details><summary>Permanent residence</summary><div>\n<p>UDI states that the time you hold a study permit does not count toward a later permanent residence application.</p>\n<div class=\"note warn\">Do not promise permanent residence as a result of graduation. Check the rules for the permit you hold when you apply.</div>\n<p class=\"links\"><a data-u=\"udiperm\">UDI permanent residence</a></p></div></details>"}, "schol": {"title": "Scholarships", "html": "<details open><summary>What the universities state</summary><div>\n<ul class=\"b\">\n<li><b>University of Oslo:</b> offers no scholarships that cover tuition fees.</li>\n<li><b>University of Agder:</b> offers no grants or scholarships.</li>\n<li><b>Other universities:</b> check each scholarship page for fee waivers. Rules and amounts change every year.</li></ul>\n<p class=\"links\"><a data-u=\"sin\">Study in Norway: costs and funding</a></p></div></details>\n<details><summary>Practical sequence</summary><div><ol class=\"b\">\n<li>Choose a programme and check its tuition fee.</li><li>Read the university’s scholarship page before you apply.</li><li>Apply by the programme deadline.</li><li>Submit any separate scholarship application if the page asks for one.</li></ol></div></details>"}}}}}};

    return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")

    .catch(function () {});

  function decorate(d) {
    d.content.meta.sub = SUB; // same subtitle for every country

  var _wu = wireUnis;

  $("#cgo").onclick = function () {
    if (!PICK) return;
    var c = PICK, cc = c.cca2.toLowerCase(), name = c.name.common, cur = Object.keys(c.currencies || {})[0] || "USD", day = new Date().toISOString().slice(0, 10);
    $("#cgo").disabled = true;
    $("#clog").innerHTML = ["Country profile", "Exchange rate to BDT", "Universities from Wikidata", "QS and THE ranks"].map(function () { return "<li></li>"; }).join("");
    step(0, "ok", name + ", " + (c.capital || ["n/a"]).join(", "));
    step(1, "", "contacting open.er-api.com"); step(2, "", "querying Wikidata");
    Promise.all([
      fx(cur).then(function (r) { step(1, "ok", "1 " + cur + " = " + (+r).toFixed(2) + " BDT"); return r; }),
      unis(c.cca2).then(function (u) { step(2, "ok", u.length + " institutions with an official website"); return u; })
    ]).then(function (v) {
      var rate = v[0], list = v[1], P = RK.providers, hits = {};
      Object.keys(P).forEach(function (p) { hits[p] = list.filter(function (u) { var r = RK.ranks[p][norm(u.name)]; return r && r.n != null; }).length; });
      step(3, "ok", Object.keys(P).map(function (p) { return P[p].short + " " + hits[p]; }).join(", ") + " matched");
      var rows = [["Capital", (c.capital || ["n/a"]).join(", ")], ["Region", c.subregion || c.region || ""], ["Languages", Object.keys(c.languages || {}).map(function (k) { return c.languages[k]; }).join(", ")],
        ["Population", (c.population || 0).toLocaleString("en-US")], ["Currency", cur], ["Exchange rate", "1 " + cur + " = " + (+rate).toFixed(2) + " BDT (" + day + ")"]];
      var ov = '<div class="card"><div class="bd" style="border:0;padding:0"><dl>' + rows.map(function (r) { return "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>"; }).join("") + "</dl></div></div>" +
        '<div class="note">Auto-built entry. Profile, exchange rate and university list come from REST Countries, open.er-api.com and Wikidata; ranks come from the bundled QS and THE data. Entry requirements, fees, deadlines, visa rules and scholarships are not auto-filled: confirm them on each university site and with the national immigration authority.</div>';
      var meta = { code: cc, name: name, flag: c.flag, currency: cur, title: "Study in " + name + ": Applicant Guide", sub: SUB,
        portal: "Wikidata", portal_url: "https://www.wikidata.org/wiki/Special:Search?search=" + encodeURIComponent(name + " university"), top_label: "", uni_title: name + " universities",
        prog_btn: "University website", list_note: "Universities come from Wikidata (institutions with an official website).", rank_note: "",
        gen_note: "Entry requirements, tuition fees and scholarships differ by programme. Open the university website and confirm with the official source.",
        caution: "<b>Auto-built entry:</b> verify every figure with the official source before advising a student." };
      CUS[cc] = { entry: { code: cc, name: name, flag: c.flag, dir: null, currency: cur, custom: true },
        facts: { last_checked: day, maintenance: {}, institutions: { listed: list.length }, links: {}, fx: Object.fromEntries([[cur + "_BDT", rate], ["date", day], ["source", "open.er-api.com"]]) },
        universities: { source: "https://www.wikidata.org/", universities: list },
        content: { meta: meta, tabs: [["overview", "Overview"], ["unis", "Universities"]], links: {}, req: {}, steps: [], sections: { overview: { title: "Overview", html: ov } } } };
      save(); CC.push(CUS[cc].entry); refreshSel(); added(); PICK = null; $("#cpick").textContent = "";
      setTimeout(function () { dlg.close(); $("#cc").value = cc; setCountry(cc, "unis"); }, 900);
    }).catch(function () {
      step(1, "er", "a source did not answer"); $("#clog").innerHTML = netfail(); $("#cgo").disabled = false;
    });
  };
})();
</script>
</body></html>
